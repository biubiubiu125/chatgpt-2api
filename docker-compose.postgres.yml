services:
  postgres:
    image: postgres:18-alpine
    container_name: chatgpt-2api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatgpt_2api_app}
      POSTGRES_USER: ${POSTGRES_USER:-chatgpt_2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - chatgpt-2api-postgres-data:/var/lib/postgresql
    networks:
      - chatgpt-2api-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chatgpt_2api}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-chatgpt_2api_app}"
      TZ: Asia/Shanghai
    networks:
      - chatgpt-2api-net

networks:
  chatgpt-2api-net:
    name: chatgpt-2api-net

volumes:
  chatgpt-2api-postgres-data:
